name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The Pages deployment needs these; nothing else in the repo does.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race each other.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      # a solver that miscounts ratings never goes live
      - run: npm test

      # The game's images are not in git; they come from the wiki and stay in
      # the Actions cache, so only images new to gamedata.json are downloaded.
      # Repository variable HIDE_IMAGES=1 skips them altogether (see README).
      - uses: actions/cache@v4
        if: vars.HIDE_IMAGES != '1'
        with:
          path: public/images
          key: wiki-images-${{ hashFiles('src/data/gamedata.json') }}
          restore-keys: wiki-images-
      - run: npm run images
        if: vars.HIDE_IMAGES != '1'

      # The custom domain mystia.varot.me is set in the repository's Pages
      # settings, so the site is served from the root.
      - run: npm run build
        env:
          VITE_HIDE_IMAGES: ${{ vars.HIDE_IMAGES }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
